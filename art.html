<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 MỸ THUẬT 2 - Bé Phan Ngọc Bình An</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        .avatar-img {
            width: 55px; height: 55px;
            border-radius: 50%; object-fit: cover;
            border: 3px solid #81C784; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        :root {
            --primary-bg: #E8F5E9;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%; max-width: 1000px;
            background: #FFFDE7; border: 8px solid #81C784;
            border-radius: 35px; padding: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }

        .btn-home {
            background: #FF7043; color: white; text-decoration: none;
            padding: 10px 18px; border-radius: 20px; font-weight: 900;
            font-size: 1rem; box-shadow: 0 4px 0 #E64A19;
            display: inline-flex; align-items: center; gap: 8px; transition: all 0.1s;
        }

        .btn-home:active { transform: translateY(3px); box-shadow: none; }
        .header-title { text-align: center; font-size: 1.8rem; color: #880E4F; margin: 0; }

        /* MUSIC TOGGLE BUTTON */
        .btn-music {
            background: #AB47BC; color: white; border: none;
            padding: 10px 16px; border-radius: 20px; font-weight: 900;
            font-size: 0.95rem; box-shadow: 0 4px 0 #7B1FA2; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }

        .user-dashboard {
            background: #FFFFFF; border-radius: 25px; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 6px 0 #A5D6A7; margin-bottom: 15px; border: 3px solid #66BB6A;
        }

        .user-info { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: 900; color: #1B5E20; }

        /* MẪU TRANH TÔ MÀU SELECTOR */
        .template-selector-container {
            margin-bottom: 15px; background: #FFF; padding: 12px;
            border-radius: 20px; border: 3px solid #FFB74D;
        }

        .template-title {
            font-weight: 900; color: #E65100; margin-bottom: 8px; font-size: 1rem;
        }

        .template-list {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
        }

        .template-item {
            width: 75px; height: 75px; border-radius: 12px; border: 3px solid #FFE0B2;
            object-fit: cover; cursor: pointer; background: white; transition: all 0.15s;
            flex-shrink: 0;
        }

        .template-item:hover, .template-item.active {
            border-color: #FF6F00; transform: scale(1.08); box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* STUDIO MỸ THUẬT LAYOUT */
        .art-studio {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 15px;
            background: white;
            padding: 15px;
            border-radius: 25px;
            border: 4px solid #F06292;
            box-shadow: 0 8px 0 #F8BBD0;
        }

        /* TOOLBAR BÊN TRÁI */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-group-title {
            font-size: 0.95rem; font-weight: 900; color: #880E4F; margin-bottom: 4px;
        }

        /* MODE TÔ MÀU (CỌ VẼ / THÙNG SƠN) */
        .mode-selector {
            display: flex; gap: 6px;
        }

        /* PALETTE BẢNG MÀU */
        .color-palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .color-dot {
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .color-dot:hover { transform: scale(1.15); }
        .color-dot.active { border-color: #2C3E50; transform: scale(1.15); }

        /* CỌ VẼ & TẨY */
        .brush-selector, .sticker-selector {
            display: flex; gap: 6px; flex-wrap: wrap;
        }

        .btn-tool {
            padding: 8px 12px;
            font-size: 0.9rem; font-weight: 800;
            border-radius: 14px; border: 2px solid #E0E0E0;
            background: #F5F5F5; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }

        .btn-tool.active {
            background: #FCE4EC; border-color: #EC407A; color: #C2185B;
        }

        /* CANVAS KHUNG VẼ */
        .canvas-area {
            position: relative;
            background: #FFFFFF;
            border-radius: 20px;
            border: 3px dashed #F48FB1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            min-height: 420px;
        }

        canvas {
            background: #FFFFFF;
            cursor: crosshair;
            border-radius: 15px;
            touch-action: none;
        }

        /* NÚT THAO TÁC CẶP SÁNG TẠO */
        .action-bar {
            display: flex; justify-content: space-between; margin-top: 15px; gap: 10px;
        }

        .big-btn {
            flex: 1; padding: 12px; font-size: 1.05rem; font-weight: 900;
            border-radius: 20px; border: none; box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        .btn-clear { background: #FF7043; }
        .btn-snap { background: #AB47BC; }
        .btn-save { background: #66BB6A; }
    </style>
</head>
<body>

<!-- AUDIO NHẠC NỀN -->
<audio id="bgMusic" loop autoplay>
    <source src="https://ia600607.us.archive.org/35/items/aqua-barbie-girl-official-music-video_202608/Aqua%20-%20Barbie%20Girl%20%28Official%20Music%20Video%29.mp3" type="audio/mpeg">
</audio>

<div id="app-container">
    <div class="top-bar">
        <a href="index.html" class="btn-home" onclick="speak('Trở về Trang chủ')">🏠 Grade-2</a>
        <h1 class="header-title">🎨 MỸ THUẬT 2 🎨</h1>
        <button class="btn-music" onclick="toggleMusic()">🎵 <span id="musicText">Tắt nhạc</span></button>
    </div>
    
    <div class="user-dashboard">
        <div class="user-info">
            <img src="binhan.png" alt="Bé Bình An" class="avatar-img">
            <div>
                <div>Bé Phan Ngọc Bình An</div>
                <div style="font-size: 0.85rem; color: #558B2F; font-weight: 700;">Góc Sáng Tạo Mỹ Thuật Lớp 2</div>
            </div>
        </div>
        <div style="font-size: 1.2rem; font-weight: 900; color: #880E4F;">🖌️ Họa sĩ nhí</div>
    </div>

    <!-- DANH SÁCH MẪU TRANH TÔ MÀU -->
    <div class="template-selector-container">
        <div class="template-title">🖼️ CHỌN MẪU TRANH ĐỂ TÔ MÀU:</div>
        <div class="template-list" id="templateList"></div>
    </div>

    <!-- KHU VỰC STUDIO MỸ THUẬT -->
    <div class="art-studio">
        <!-- BẢNG CÔNG CỤ BÊN TRÁI -->
        <div class="toolbar">
            <!-- 1. CHẾ ĐỘ TÔ MÀU -->
            <div>
                <div class="tool-group-title">🧰 CHẾ ĐỘ TÔ</div>
                <div class="mode-selector">
                    <button class="btn-tool active" id="btn-mode-fill" onclick="setPaintMode('fill')">🪣 Tô mảng</button>
                    <button class="btn-tool" id="btn-mode-brush" onclick="setPaintMode('brush')">🖌️ Cọ vẽ</button>
                </div>
            </div>

            <!-- 2. BẢNG MÀU -->
            <div>
                <div class="tool-group-title">🎨 BẢNG MÀU RỰC RỠ</div>
                <div class="color-palette">
                    <div class="color-dot active" style="background: #E53935;" onclick="selectColor('#E53935', this)"></div>
                    <div class="color-dot" style="background: #FB8C00;" onclick="selectColor('#FB8C00', this)"></div>
                    <div class="color-dot" style="background: #FDD835;" onclick="selectColor('#FDD835', this)"></div>
                    <div class="color-dot" style="background: #4CAF50;" onclick="selectColor('#4CAF50', this)"></div>
                    <div class="color-dot" style="background: #00ACC1;" onclick="selectColor('#00ACC1', this)"></div>
                    <div class="color-dot" style="background: #1E88E5;" onclick="selectColor('#1E88E5', this)"></div>
                    <div class="color-dot" style="background: #8E24AA;" onclick="selectColor('#8E24AA', this)"></div>
                    <div class="color-dot" style="background: #D81B60;" onclick="selectColor('#D81B60', this)"></div>
                    <div class="color-dot" style="background: #6D4C41;" onclick="selectColor('#6D4C41', this)"></div>
                    <div class="color-dot" style="background: #000000;" onclick="selectColor('#000000', this)"></div>
                    <div class="color-dot" style="background: #9E9E9E;" onclick="selectColor('#9E9E9E', this)"></div>
                    <div class="color-dot" style="background: #FFFFFF; border:2px solid #CCC;" onclick="selectColor('#FFFFFF', this)"></div>
                </div>
            </div>

            <!-- 3. NÉT CỌ VẼ -->
            <div>
                <div class="tool-group-title">✏️ NÉT CỌ & TẨY</div>
                <div class="brush-selector">
                    <button class="btn-tool active" id="btn-small" onclick="selectBrush(3, 'small')">Nét nhỏ</button>
                    <button class="btn-tool" id="btn-medium" onclick="selectBrush(8, 'medium')">Nét vừa</button>
                    <button class="btn-tool" id="btn-large" onclick="selectBrush(18, 'large')">Nét to</button>
                    <button class="btn-tool" id="btn-eraser" onclick="selectEraser()">🧹 Tẩy</button>
                </div>
            </div>

            <!-- 4. STICKER TRANG TRÍ -->
            <div>
                <div class="tool-group-title">⭐ NHÃN DÁN STICKER</div>
                <div class="sticker-selector">
                    <button class="btn-tool" onclick="stampSticker('🌸')">🌸 Hoa</button>
                    <button class="btn-tool" onclick="stampSticker('⭐')">⭐ Sao</button>
                    <button class="btn-tool" onclick="stampSticker('☀️')">☀️ Mặt trời</button>
                    <button class="btn-tool" onclick="stampSticker('🦋')">🦋 Bướm</button>
                </div>
            </div>
        </div>

        <!-- BẢN VẼ CANVAS BÊN PHẢI -->
        <div class="canvas-area">
            <canvas id="paintCanvas" width="600" height="420"></canvas>
        </div>
    </div>

    <!-- NÚT THAO TÁC XÓA / CHỤP HÌNH / LƯU -->
    <div class="action-bar">
        <button class="big-btn btn-clear" onclick="clearCanvas()">🗑️ XÓA VẼ LẠI</button>
        <button class="big-btn btn-snap" onclick="takeSnapshot()">📸 CHỤP THÀNH QUẢ</button>
        <button class="big-btn btn-save" onclick="saveArtwork()">💾 LƯU BỨC TRANH</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const bgMusic = document.getElementById('bgMusic');

    // Danh sách 8 hình mẫu tô màu
    const templates = [
        "https://i.ibb.co/0zvqGGz/mtcd9.png",
        "https://i.ibb.co/BKzBw40R/mtcd8.png",
        "https://i.ibb.co/8DTP4FKr/mtcd7.png",
        "https://i.ibb.co/qL0F8v8X/mtc6.png",
        "https://i.ibb.co/tTqxNnj0/mtc5.png",
        "https://i.ibb.co/Y4g9TGHs/mt-cd4.png",
        "https://i.ibb.co/23bC2q2f/mt-cd3.png",
        "https://i.ibb.co/HTZ6xsgb/mt-cd2.png"
    ];

    let currentTemplateImage = null;
    let isDrawing = false;
    let currentColor = '#E53935';
    let currentLineWidth = 3;
    let isEraser = false;
    let paintMode = 'fill'; // 'fill' hoặc 'brush'

    // Giọng đọc AI
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'vi-VN';
            msg.rate = 0.95;
            window.speechSynthesis.speak(msg);
        }
    }

    // Bật / Tắt Nhạc nền
    function toggleMusic() {
        if (bgMusic.paused) {
            bgMusic.play();
            document.getElementById('musicText').innerText = "Tắt nhạc";
        } else {
            bgMusic.pause();
            document.getElementById('musicText').innerText = "Bật nhạc";
        }
    }

    window.onload = function() {
        // Tự động phát audio khi bé tương tác
        document.body.addEventListener('click', () => {
            if (bgMusic.paused && document.getElementById('musicText').innerText === "Tắt nhạc") {
                bgMusic.play().catch(() => {});
            }
        }, { once: true });

        initTemplates();
        loadTemplate(0);
        speak('Chào mừng họa sĩ nhí Phan Ngọc Bình An đến với Góc sáng tạo Mỹ thuật 2!');
    };

    // Khởi tạo danh sách mẫu tô màu
    function initTemplates() {
        const container = document.getElementById('templateList');
        container.innerHTML = '';
        templates.forEach((url, idx) => {
            const img = document.createElement('img');
            img.src = url;
            img.className = `template-item ${idx === 0 ? 'active' : ''}`;
            img.crossOrigin = "Anonymous";
            img.onclick = () => {
                document.querySelectorAll('.template-item').forEach(el => el.classList.remove('active'));
                img.classList.add('active');
                loadTemplate(idx);
            };
            container.appendChild(img);
        });
    }

    // Nạp mẫu hình lên Canvas
    function loadTemplate(index) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = templates[index];
        img.onload = () => {
            currentTemplateImage = img;
            resetCanvasWithImage();
            speak(`Đã tải bức tranh mẫu số ${index + 1}`);
        };
    }

    function resetCanvasWithImage() {
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (currentTemplateImage) {
            // Vẽ vừa vặn vào canvas
            ctx.drawImage(currentTemplateImage, 0, 0, canvas.width, canvas.height);
        }
    }

    // Đổi Chế độ tô (Mảng / Cọ)
    function setPaintMode(mode) {
        paintMode = mode;
        document.getElementById('btn-mode-fill').classList.toggle('active', mode === 'fill');
        document.getElementById('btn-mode-brush').classList.toggle('active', mode === 'brush');
        if (mode === 'fill') speak('Đã chọn tô theo mảng');
        else speak('Đã chọn vẽ cọ tự do');
    }

    // Chọn màu sắc
    function selectColor(colorHex, element) {
        currentColor = colorHex;
        isEraser = false;
        document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('btn-eraser').classList.remove('active');
    }

    // Chọn cỡ nét cọ
    function selectBrush(size, type) {
        currentLineWidth = size;
        isEraser = false;
        setPaintMode('brush');
        document.querySelectorAll('.brush-selector .btn-tool').forEach(el => el.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');
    }

    // Chọn công cụ tẩy
    function selectEraser() {
        isEraser = true;
        setPaintMode('brush');
        document.querySelectorAll('.brush-selector .btn-tool').forEach(el => el.classList.remove('active'));
        document.getElementById('btn-eraser').classList.add('active');
        speak('Bé chọn công cụ Tẩy');
    }

    // TÔ MẢNG (FLOOD FILL ALGORITHM)
    function hexToRgb(hex) {
        let c = hex.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        return [ (num >> 16) & 255, (num >> 8) & 255, num & 255, 255 ];
    }

    function floodFill(startX, startY, fillColor) {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const width = canvas.width;
        const height = canvas.height;

        const targetPos = (startY * width + startX) * 4;
        const targetR = data[targetPos];
        const targetG = data[targetPos + 1];
        const targetB = data[targetPos + 2];
        const targetA = data[targetPos + 3];

        const [fillR, fillG, fillB, fillA] = hexToRgb(fillColor);

        // Nét đen viền không tô tràn
        if (targetR < 50 && targetG < 50 && targetB < 50) return;
        if (targetR === fillR && targetG === fillG && targetB === fillB) return;

        const pixelStack = [[startX, startY]];

        while (pixelStack.length > 0) {
            const [x, y] = pixelStack.pop();
            let currentPos = (y * width + x) * 4;

            let MathY = y;
            while (MathY >= 0 && matchColor(currentPos)) {
                MathY--;
                currentPos -= width * 4;
            }

            currentPos += width * 4;
            MathY++;

            let reachLeft = false;
            let reachRight = false;

            while (MathY < height && matchColor(currentPos)) {
                data[currentPos] = fillR;
                data[currentPos + 1] = fillG;
                data[currentPos + 2] = fillB;
                data[currentPos + 3] = fillA;

                if (x > 0) {
                    if (matchColor(currentPos - 4)) {
                        if (!reachLeft) {
                            pixelStack.push([x - 1, MathY]);
                            reachLeft = true;
                        }
                    } else if (reachLeft) {
                        reachLeft = false;
                    }
                }

                if (x < width - 1) {
                    if (matchColor(currentPos + 4)) {
                        if (!reachRight) {
                            pixelStack.push([x + 1, MathY]);
                            reachRight = true;
                        }
                    } else if (reachRight) {
                        reachRight = false;
                    }
                }

                MathY++;
                currentPos += width * 4;
            }
        }

        ctx.putImageData(imageData, 0, 0);

        function matchColor(pos) {
            const r = data[pos];
            const g = data[pos + 1];
            const b = data[pos + 2];
            const a = data[pos + 3];
            return Math.abs(r - targetR) < 30 && Math.abs(g - targetG) < 30 && Math.abs(b - targetB) < 30;
        }
    }

    // THAO TÁC CỌ VẼ
    function startDrawing(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX || e.touches[0].clientX) - rect.left);
        const y = Math.floor((e.clientY || e.touches[0].clientY) - rect.top);

        if (paintMode === 'fill') {
            floodFill(x, y, currentColor);
        } else {
            isDrawing = true;
            draw(e);
        }
    }

    function stopDrawing() {
        isDrawing = false;
        ctx.beginPath();
    }

    function draw(e) {
        if (!isDrawing || paintMode === 'fill') return;

        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;

        ctx.lineWidth = isEraser ? 25 : currentLineWidth;
        ctx.lineCap = 'round';
        ctx.strokeStyle = isEraser ? '#FFFFFF' : currentColor;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    // Sự kiện Chuột & Cảm ứng
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

    // Dán Sticker
    function stampSticker(symbol) {
        ctx.font = "40px Nunito";
        ctx.fillText(symbol, canvas.width / 2 - 20, canvas.height / 2);
        speak(`Đã dán nhãn ${symbol}`);
    }

    // Xóa vẽ lại
    function clearCanvas() {
        resetCanvasWithImage();
        speak('Đã làm sạch trang vẽ');
    }

    // CHỤP THÀNH QUẢ (SNAPSHOT VỚI KHUNG ẢNH NGHỆ THUẬT)
    function takeSnapshot() {
        const snapCanvas = document.createElement('canvas');
        snapCanvas.width = 700;
        snapCanvas.height = 550;
        const snapCtx = snapCanvas.getContext('2d');

        // Nền khung ảnh nghệ thuật
        snapCtx.fillStyle = "#FFFDE7";
        snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
        
        snapCtx.lineWidth = 10;
        snapCtx.strokeStyle = "#FF7043";
        snapCtx.strokeRect(15, 15, snapCanvas.width - 30, snapCanvas.height - 30);

        // Vẽ tác phẩm lên giữa khung
        snapCtx.drawImage(canvas, 50, 50, 600, 420);

        // Dòng chữ kỷ niệm
        snapCtx.fillStyle = "#880E4F";
        snapCtx.font = "bold 22px Nunito";
        snapCtx.fillText("🎨 TÁC PHẨM CỦA HỌA SĨ NHÍ: BÌNH AN", 60, 510);
        snapCtx.fillText("⭐ ĐIỂM: 10/10", 500, 510);

        // Tải ảnh về
        const image = snapCanvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'ThanhQua_MyThuat_BinhAn.png';
        link.href = image;
        link.click();

        speak('Tách! Tách! Đã chụp hình thành quả của bé Bình An thành công! Bức tranh quá đẹp!');
    }

    // Lưu tranh
    function saveArtwork() {
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'BucTranh_Cua_Be_BinhAn.png';
        link.href = image;
        link.click();
        speak('Bức tranh của bé Bình An đã được lưu thành công!');
    }
</script>

</body>
</html>
