<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán Lớp 2 - Chủ Đề 1</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #f0fdf4;
            --main-border: #86efac;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-orange: #ff7675;
            --primary-blue: #74b9ff;
            --primary-purple: #a29bfe;
            --primary-green: #55efc4;
            --primary-yellow: #ffeaa7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            background: #fffef0;
            border: 8px solid var(--main-border);
            border-radius: 36px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }

        /* Top Header */
        .header-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #2d3436;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-grade {
            background: #ff7675;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            box-shadow: 0 4px 0 #d63031;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-grade:hover {
            opacity: 0.9;
        }

        /* Student Profile Card */
        .profile-card {
            background: #ffffff;
            border: 3px solid #6c5ce7;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            box-shadow: 0 4px 0 #a29bfe;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #6c5ce7;
            object-fit: cover;
        }

        .user-details h3 {
            font-size: 1.1rem;
            color: #2d3436;
            font-weight: 800;
        }

        .user-details p {
            font-size: 0.85rem;
            color: #636e72;
            font-weight: 700;
        }

        .score-badge {
            background: #ffeaa7;
            border: 2px solid #fdcb6e;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 900;
            color: #d63031;
            font-size: 1.1rem;
            box-shadow: 0 3px 0 #fdcb6e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Navigation Modes */
        .nav-modes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .mode-btn {
            border: none;
            padding: 12px;
            border-radius: 18px;
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .mode-btn:active { transform: translateY(3px); }
        .mode-play { background: #ff7675; box-shadow: 0 4px 0 #d63031; }
        .mode-learn { background: #74b9ff; box-shadow: 0 4px 0 #0984e3; }
        .mode-practice { background: #a29bfe; box-shadow: 0 4px 0 #6c5ce7; }
        .mode-challenge { background: #00b894; box-shadow: 0 4px 0 #008f68; }

        /* Lesson Selection Container */
        .topic-header-bar {
            background: #e8f8f5;
            border: 3px solid #55efc4;
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 900;
            color: #00b894;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #55efc4;
        }

        .lesson-select-box {
            margin-bottom: 20px;
        }

        .lesson-select-box select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 18px;
            border: 3px solid #74b9ff;
            font-weight: 800;
            font-size: 1.05rem;
            color: #2d3436;
            background: white;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 0 #74b9ff;
        }

        /* Content Card */
        .content-card {
            background: white;
            border: 3px solid #74b9ff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 5px 0 #0984e3;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #dfe6e9;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .btn-audio {
            background: #00b894;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #008f68;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        .btn-audio.stop {
            background: #ff7675;
            box-shadow: 0 3px 0 #d63031;
        }

        .box-section {
            background: #f8fafc;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 6px solid #74b9ff;
        }

        .box-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #2d3436;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .box-body ul {
            padding-left: 20px;
            line-height: 1.7;
        }

        .box-body li {
            margin-bottom: 6px;
            font-weight: 700;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header: Nút Homepage đã gắn liên kết chính xác -->
        <div class="header-title">
            <a href="https://huycomf2020.github.io/Grade-2/" class="btn-grade">
                <i class="fa-solid fa-house"></i> Grade-2
            </a>
            <span>📐 TOÁN 2 ✏️</span>
        </div>

        <!-- Student Profile Card -->
        <div class="profile-card">
            <div class="user-info">
                <img src="binhan.png" alt="Bình An" class="avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=BinhAn'">
                <div class="user-details">
                    <h3>Bé Phan Ngọc Bình An</h3>
                    <p>Lớp 2A • SGK Kết nối tri thức</p>
                </div>
            </div>
            <div class="score-badge">
                <i class="fa-solid fa-star"></i> 150 điểm
            </div>
        </div>

        <!-- Mode Navigation -->
        <div class="nav-modes">
            <button class="mode-btn mode-play"><i class="fa-solid fa-gamepad"></i> CHƠI</button>
            <button class="mode-btn mode-learn"><i class="fa-solid fa-book-open"></i> HỌC</button>
            <button class="mode-btn mode-practice"><i class="fa-solid fa-pen-to-square"></i> ÔN TẬP</button>
            <button class="mode-btn mode-challenge"><i class="fa-solid fa-trophy"></i> THỬ THÁCH</button>
        </div>

        <!-- Nội dung Chủ đề 1 -->
        <div class="topic-header-bar">
            🐰 CHỦ ĐỀ 1: ÔN TẬP VÀ BỔ SUNG (Bài 1 - 6)
        </div>

        <!-- Dropdown chọn Bài học -->
        <div class="lesson-select-box">
            <select id="lesson-dropdown" onchange="selectLesson(this.value)">
                <!-- JavaScript sẽ render danh sách 6 bài học -->
            </select>
        </div>

        <!-- Khung Nội dung Bài học -->
        <div class="content-card">
            <div class="content-header">
                <h2 id="lesson-title-display" style="font-size: 1.3rem; font-weight: 800; color: #6c5ce7;">Bài 1: Ôn tập các số đến 100</h2>
                <button id="btn-read" class="btn-audio" onclick="toggleReadTheory()">
                    <i class="fa-solid fa-volume-high"></i> Đọc Lý Thuyết
                </button>
            </div>

            <!-- Lý Thuyết -->
            <div class="box-section" style="border-left-color: #74b9ff;">
                <div class="box-title"><i class="fa-solid fa-book-open" style="color: #74b9ff;"></i> Lý Thuyết</div>
                <div class="box-body" id="theory-display"></div>
            </div>

            <!-- Luyện Tập -->
            <div class="box-section" style="border-left-color: #a29bfe;">
                <div class="box-title"><i class="fa-solid fa-pen-to-square" style="color: #a29bfe;"></i> Luyện Tập (Bài Tập)</div>
                <div class="box-body" id="practice-display"></div>
            </div>

            <!-- Trò Chơi -->
            <div class="box-section" style="border-left-color: #ff7675;">
                <div class="box-title"><i class="fa-solid fa-gamepad" style="color: #ff7675;"></i> Trò Chơi Học Tập</div>
                <div class="box-body" id="game-display"></div>
            </div>
        </div>
    </div>

    <!-- File JS cho Chủ đề 1 -->
    <script src="math2-topic1.js"></script>
</body>
</html>
