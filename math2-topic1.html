<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán Lớp 2 - Chủ Đề 1</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #f0fdf4;
            --main-border: #86efac;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-orange: #ff7675;
            --primary-blue: #74b9ff;
            --primary-purple: #a29bfe;
            --primary-green: #00b894;
            --primary-yellow: #ffeaa7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background: #fffef0;
            border: 8px solid var(--main-border);
            border-radius: 36px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Top Header */
        .header-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #2d3436;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-grade {
            background: #ff7675;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            box-shadow: 0 4px 0 #d63031;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Student Profile Card */
        .profile-card {
            background: #ffffff;
            border: 3px solid #6c5ce7;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #a29bfe;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #6c5ce7;
            object-fit: cover;
        }

        .user-details h3 { font-size: 1.1rem; color: #2d3436; font-weight: 800; }
        .user-details p { font-size: 0.85rem; color: #636e72; font-weight: 700; }

        .score-badge {
            background: #ffeaa7;
            border: 2px solid #fdcb6e;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 900;
            color: #d63031;
            font-size: 1.1rem;
            box-shadow: 0 3px 0 #fdcb6e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Dynamic Mode Navigation Tabs */
        .nav-modes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            border: none;
            padding: 12px;
            border-radius: 18px;
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            opacity: 0.7;
        }

        .mode-btn.active {
            opacity: 1;
            transform: scale(1.03);
        }

        .mode-learn { background: #74b9ff; box-shadow: 0 4px 0 #0984e3; }
        .mode-practice { background: #a29bfe; box-shadow: 0 4px 0 #6c5ce7; }
        .mode-play { background: #ff7675; box-shadow: 0 4px 0 #d63031; }
        .mode-challenge { background: #00b894; box-shadow: 0 4px 0 #008f68; }

        /* Topic Header Bar */
        .topic-header-bar {
            background: #e8f8f5;
            border: 3px solid #55efc4;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 900;
            color: #00b894;
            font-size: 1.1rem;
        }

        /* Lesson Navigation Bar (thay thế Dropdown) */
        .lesson-nav-bar {
            background: white;
            border: 3px solid #ffeaa7;
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #fdcb6e;
        }

        .btn-nav-lesson {
            background: #ff7675;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #d63031;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav-lesson:disabled {
            background: #b2bec3;
            box-shadow: none;
            cursor: not-allowed;
        }

        .current-lesson-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: #2d3436;
            text-align: center;
        }

        .lesson-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dfe6e9;
            cursor: pointer;
        }

        .dot.active {
            background: #ff7675;
            transform: scale(1.3);
        }

        /* Dynamic Content Panel */
        .content-panel {
            background: white;
            border: 3px solid #74b9ff;
            border-radius: 24px;
            padding: 24px;
            min-height: 320px;
            box-shadow: 0 5px 0 #0984e3;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Audio Control */
        .btn-audio {
            background: #00b894;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #008f68;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-audio.stop { background: #ff7675; box-shadow: 0 3px 0 #d63031; }

        /* Content Formats */
        .theory-box {
            background: #f0f8ff;
            border-left: 6px solid #74b9ff;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 700;
            color: #2d3436;
        }

        .exercise-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .exercise-title {
            font-weight: 800;
            color: #6c5ce7;
            margin-bottom: 6px;
        }

        .interactive-game {
            background: #fff9db;
            border: 3px dashed #fdcb6e;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: #d63031;
            margin-bottom: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #74b9ff;
            padding: 10px 20px;
            border-radius: 14px;
            margin: 5px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #74b9ff;
        }

        .option-btn:hover { background: #74b9ff; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header -->
        <div class="header-title">
            <a href="math2-volume1.html" class="btn-grade">
                <i class="fa-solid fa-house"></i> Grade-2
            </a>
            <span>📐 TOÁN 2 - CHỦ ĐỀ 1 ✏️</span>
        </div>

        <!-- Student Profile Card -->
        <div class="profile-card">
            <div class="user-info">
                <img src="binhan.png" alt="Bình An" class="avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=BinhAn'">
                <div class="user-details">
                    <h3>Bé Phan Ngọc Bình An</h3>
                    <p>Lớp 2A • SGK Kết nối tri thức</p>
                </div>
            </div>
            <div class="score-badge">
                <i class="fa-solid fa-star"></i> <span id="user-score">150</span> điểm
            </div>
        </div>

        <!-- Dynamic 4 Navigation Tabs -->
        <div class="nav-modes">
            <button class="mode-btn mode-learn active" onclick="switchTab('learn')">
                <i class="fa-solid fa-book-open"></i> HỌC
            </button>
            <button class="mode-btn mode-practice" onclick="switchTab('practice')">
                <i class="fa-solid fa-pen-to-square"></i> LUYỆN TẬP
            </button>
            <button class="mode-btn mode-play" onclick="switchTab('play')">
                <i class="fa-solid fa-gamepad"></i> CHƠI
            </button>
            <button class="mode-btn mode-challenge" onclick="switchTab('challenge')">
                <i class="fa-solid fa-trophy"></i> THỬ THÁCH
            </button>
        </div>

        <!-- Lesson Navigation Bar (Nút Prev/Next) -->
        <div class="lesson-nav-bar">
            <button class="btn-nav-lesson" id="btn-prev" onclick="changeLesson(-1)">
                <i class="fa-solid fa-arrow-left"></i> Bài trước
            </button>
            
            <div>
                <div class="current-lesson-title" id="lesson-title">Bài 1: Ôn tập các số đến 100</div>
                <div class="lesson-dots" id="lesson-dots-container"></div>
            </div>

            <button class="btn-nav-lesson" id="btn-next" onclick="changeLesson(1)">
                Bài tiếp <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Content Panel -->
        <div class="content-panel">
            <!-- TAB HỌC -->
            <div id="tab-learn" class="tab-content active">
                <button id="btn-read" class="btn-audio" onclick="toggleReadTheory()">
                    <i class="fa-solid fa-volume-high"></i> Đọc Lý Thuyết
                </button>
                <div class="theory-box" id="theory-content"></div>
            </div>

            <!-- TAB LUYỆN TẬP -->
            <div id="tab-practice" class="tab-content">
                <div id="practice-content"></div>
            </div>

            <!-- TAB CHƠI -->
            <div id="tab-play" class="tab-content">
                <div id="play-content"></div>
            </div>

            <!-- TAB THỬ THÁCH -->
            <div id="tab-challenge" class="tab-content">
                <div id="challenge-content"></div>
            </div>
        </div>
    </div>

    <!-- Script Chủ đề 1 -->
    <script src="math2-topic1.js"></script>
</body>
</html>
