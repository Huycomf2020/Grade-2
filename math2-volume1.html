<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Toán Lớp 2 - Tập 1 (Kết Nối Tri Thức)</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #ff6b6b;
            --accent: #f5a623;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .math2-app {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #357abd);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { margin: 0 0 5px 0; font-size: 26px; }
        header p { margin: 0; opacity: 0.9; font-size: 14px; }

        /* Topic Menu */
        .topic-nav {
            display: flex;
            background: #eef2f5;
            overflow-x: auto;
            padding: 10px;
            gap: 10px;
            border-bottom: 1px solid #ddd;
        }

        .topic-btn {
            background: white;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
            transition: all 0.2s;
        }

        .topic-btn.active, .topic-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Tabs inside Topic */
        .section-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px 0;
        }

        .tab-btn {
            background: #f1f1f1;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--secondary);
            color: white;
        }

        .tab-content {
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Theory Styles */
        .theory-box {
            background: #eef9ff;
            border-left: 5px solid var(--primary);
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .theory-box h3 { margin-top: 0; color: var(--primary); }

        /* Quiz Styles */
        .quiz-card {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover { background: #e2e8f0; }

        /* Game Canvas / Area */
        .game-box {
            text-align: center;
            background: #fff8e7;
            border: 2px dashed var(--accent);
            padding: 30px;
            border-radius: 12px;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="math2-app">
    <header>
        <h1>📚 Khám Phá Toán Lớp 2 - Tập 1</h1>
        <p>Sách giáo khoa Kết nối tri thức với cuộc sống</p>
    </header>

    <!-- Thanh chọn Chủ đề -->
    <div class="topic-nav" id="m2TopicNav"></div>

    <!-- Thanh chuyển phần học (Lý thuyết / Thực hành / Trò chơi) -->
    <div class="section-tabs">
        <button class="tab-btn active" onclick="switchTab('theory')">📖 Lý Thuyết</button>
        <button class="tab-btn" onclick="switchTab('practice')">✍️ Luyện Tập</button>
        <button class="tab-btn" onclick="switchTab('game')">🎮 Trò Chơi Ôn Tập</button>
    </div>

    <!-- Nội dung 1: Lý Thuyết -->
    <div id="tab-theory" class="tab-content active">
        <div class="theory-box" id="theoryContent">
            <!-- Render từ JS -->
        </div>
    </div>

    <!-- Nội dung 2: Luyện Tập (Bài tập chuẩn SGK) -->
    <div id="tab-practice" class="tab-content">
        <div class="quiz-card">
            <div id="practiceQuestion" style="font-size: 18px; font-weight: bold;"></div>
            <div class="options-grid" id="practiceOptions"></div>
            <div class="feedback" id="practiceFeedback"></div>
        </div>
    </div>

    <!-- Nội dung 3: Trò Chơi Ôn Tập -->
    <div id="tab-game" class="tab-content">
        <div class="game-box" id="gameArea">
            <!-- Game tương tác nhỏ -->
        </div>
    </div>
</div>

<script src="math2-volume1.js"></script>
</body>
</html>
