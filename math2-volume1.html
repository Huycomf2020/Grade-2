<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Toán Lớp 2 - Tập 1 (Kết Nối Tri Thức)</title>
    <!-- Font chữ trẻ em vui nhộn -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #A29BFE;
            --bg: #F0F7FF;
            --card-bg: #FFFFFF;
            --text: #2D3436;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Fredoka', 'Segoe UI', cursive, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#4ECDC4 0.75px, transparent 0.75px), radial-gradient(#FF6B6B 0.75px, var(--bg) 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .math2-app {
            max-width: 920px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
            border: 4px solid #E2E8F0;
            overflow: hidden;
            position: relative;
        }

        /* Header phong cách Game */
        header {
            background: linear-gradient(135deg, #FF7675, #FD79A8);
            color: white;
            padding: 20px 15px;
            text-align: center;
            position: relative;
            border-bottom: 5px solid #E84393;
        }

        header h1 { 
            margin: 0; 
            font-size: 30px; 
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2); 
            letter-spacing: 0.5px;
        }

        header p { 
            margin: 5px 0 0 0; 
            font-size: 15px; 
            background: rgba(255,255,255,0.25); 
            display: inline-block; 
            padding: 4px 15px; 
            border-radius: 20px; 
        }

        .score-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent);
            color: #D63031;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 0 #E1B12C;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Menu Chọn Chủ Đề */
        .topic-nav {
            display: flex;
            background: #EAF2F8;
            overflow-x: auto;
            padding: 12px;
            gap: 10px;
            border-bottom: 3px solid #DFE6E9;
            align-items: center;
        }

        .topic-btn {
            background: white;
            border: 2px solid #B2BEC3;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            box-shadow: 0 4px 0 #B2BEC3;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .topic-btn.active, .topic-btn:hover {
            background: var(--secondary);
            color: white;
            border-color: #00B894;
            box-shadow: 0 4px 0 #00876C;
            transform: translateY(-2px);
        }

        /* Nav Tabs */
        .section-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 10px 0;
            padding: 0 10px;
        }

        .tab-btn {
            background: #F1F2F6;
            border: 2px solid #CED6E0;
            padding: 10px 22px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: #57606F;
            box-shadow: 0 4px 0 #CED6E0;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: #D63031;
            box-shadow: 0 4px 0 #D63031;
        }

        .tab-content {
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Module Lý Thuyết */
        .theory-box {
            background: #E3FAF5;
            border: 3px solid var(--secondary);
            border-radius: 20px;
            padding: 20px;
            line-height: 1.7;
            font-size: 17px;
        }

        .theory-box h3 { margin-top: 0; color: #00876C; font-size: 20px; }

        /* Module Luyện Tập & Quiz */
        .quiz-card {
            background: #FFF9E6;
            border: 3px solid var(--accent);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 8px 0 #FFEAA7;
        }

        .question-title {
            font-size: 20px;
            font-weight: 700;
            color: #2D3436;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #74B9FF;
            padding: 14px 18px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            color: #2D3436;
            box-shadow: 0 5px 0 #0984E3;
            transition: all 0.15s;
            font-family: inherit;
            text-align: left;
        }

        .option-btn:hover {
            background: #E8F0FE;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0984E3;
        }

        /* Module Game */
        .game-box {
            text-align: center;
            background: #F3E5F5;
            border: 3px dashed var(--purple);
            padding: 30px 20px;
            border-radius: 20px;
        }

        /* Animation & Feedback */
        .feedback {
            margin-top: 18px;
            font-weight: 700;
            font-size: 20px;
            min-height: 30px;
            text-align: center;
        }

        .correct { color: #10B981; animation: bounce 0.5s ease; }
        .wrong { color: #EF4444; animation: shake 0.4s ease; }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .score-badge { position: relative; top: 0; right: 0; margin: 10px auto 0 auto; width: fit-content; }
        }
    </style>
</head>
<body>

<div class="math2-app">
    <header>
        <h1>🎈 TOÁN LỚP 2 - TẬP 1 🐻</h1>
        <p>Kết Nối Tri Thức Với Cuộc Sống</p>
        <div class="score-badge">⭐ <span id="userScore">0</span></div>
    </header>

    <!-- Thanh chọn chủ đề -->
    <div class="topic-nav" id="m2TopicNav"></div>

    <!-- Thanh chuyển tab -->
    <div class="section-tabs">
        <button class="tab-btn active" data-tab="theory">📖 Lý Thuyết</button>
        <button class="tab-btn" data-tab="practice">✍️ Luyện Tập</button>
        <button class="tab-btn" data-tab="game">🎮 Trò Chơi</button>
    </div>

    <!-- Tab 1: Lý Thuyết -->
    <div id="tab-theory" class="tab-content active">
        <div class="theory-box" id="theoryContent">Đang nạp kiến thức...</div>
    </div>

    <!-- Tab 2: Luyện Tập -->
    <div id="tab-practice" class="tab-content">
        <div class="quiz-card">
            <div id="practiceQuestion" class="question-title"></div>
            <div class="options-grid" id="practiceOptions"></div>
            <div class="feedback" id="practiceFeedback"></div>
        </div>
    </div>

    <!-- Tab 3: Trò Chơi -->
    <div id="tab-game" class="tab-content">
        <div class="game-box" id="gameArea">Đang tải trò chơi vui nhộn...</div>
    </div>
</div>

<script src="math2-volume1.js"></script>
</body>
</html>
