<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Toán Lớp 2 - Tập 1 (Kết Nối Tri Thức)</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #ff6b6b;
            --accent: #f5a623;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .math2-app {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { margin: 0 0 5px 0; font-size: 26px; }
        header p { margin: 0; opacity: 0.9; font-size: 14px; }

        /* Topic Nav Bar */
        .topic-nav {
            display: flex;
            background: #e2e8f0;
            overflow-x: auto;
            padding: 12px;
            gap: 10px;
            border-bottom: 1px solid #cbd5e1;
            min-height: 55px;
            align-items: center;
        }

        .topic-btn {
            background: white;
            border: 1px solid #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .topic-btn.active, .topic-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Section Tabs */
        .section-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px 0;
        }

        .tab-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        .tab-content {
            padding: 20px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Content Modules */
        .theory-box {
            background: #eff6ff;
            border-left: 5px solid var(--primary);
            padding: 18px 20px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .theory-box h3 { margin-top: 0; color: var(--primary); }

        .quiz-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .option-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover { 
            background: #e2e8f0; 
            border-color: var(--primary);
        }

        .game-box {
            text-align: center;
            background: #fffbeeb3;
            border: 2px dashed var(--accent);
            padding: 25px;
            border-radius: 12px;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .correct { color: #16a34a; }
        .wrong { color: #dc2626; }
    </style>
</head>
<body>

<div class="math2-app">
    <header>
        <h1>📚 Khám Phá Toán Lớp 2 - Tập 1</h1>
        <p>Sách giáo khoa Kết nối tri thức với cuộc sống</p>
    </header>

    <!-- Thanh danh sách chủ đề -->
    <div class="topic-nav" id="m2TopicNav"></div>

    <!-- Thanh chuyển Tab học tập -->
    <div class="section-tabs">
        <button class="tab-btn active" data-tab="theory">📖 Lý Thuyết</button>
        <button class="tab-btn" data-tab="practice">✍️ Luyện Tập</button>
        <button class="tab-btn" data-tab="game">🎮 Trò Chơi Ôn Tập</button>
    </div>

    <!-- Nội dung Tab 1: Lý Thuyết -->
    <div id="tab-theory" class="tab-content active">
        <div class="theory-box" id="theoryContent">Đang tải lý thuyết...</div>
    </div>

    <!-- Nội dung Tab 2: Luyện Tập -->
    <div id="tab-practice" class="tab-content">
        <div class="quiz-card">
            <div id="practiceQuestion" style="font-size: 18px; font-weight: bold;"></div>
            <div class="options-grid" id="practiceOptions"></div>
            <div class="feedback" id="practiceFeedback"></div>
        </div>
    </div>

    <!-- Nội dung Tab 3: Trò Chơi -->
    <div id="tab-game" class="tab-content">
        <div class="game-box" id="gameArea">Đang tải trò chơi...</div>
    </div>
</div>

<script src="math2-volume1.js"></script>
</body>
</html>
