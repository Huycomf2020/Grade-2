<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Toán Lớp 2 - Tập 1 (Kết Nối Tri Thức)</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 320px;
            background-color: var(--card-bg);
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            background-color: var(--primary-color);
            color: white;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .topic-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .topic-group {
            margin-bottom: 15px;
        }

        .topic-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #6b7280;
            padding: 8px 10px;
            text-transform: uppercase;
        }

        .lesson-item {
            padding: 10px 14px;
            margin: 3px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lesson-item:hover {
            background-color: #e0e7ff;
            color: var(--primary-color);
        }

        .lesson-item.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        /* Main Content Area */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 30px;
        }

        .lesson-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .lesson-header {
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-header h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
        }

        /* Controls for Voice */
        .audio-controls {
            display: flex;
            gap: 10px;
        }

        .btn-audio {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-audio:hover {
            background-color: #059669;
        }

        .btn-audio.stop {
            background-color: #ef4444;
        }

        .btn-audio.stop:hover {
            background-color: #dc2626;
        }

        /* Content Sections */
        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.2rem;
            color: #374151;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary-color);
        }

        .section-body {
            background-color: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Toán Lớp 2 - Tập 1</h2>
            <p>Kết nối tri thức với cuộc sống</p>
        </div>
        <div class="topic-list" id="topic-container">
            <!-- Danh sách bài học sẽ được render bằng JS -->
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="lesson-card">
            <div class="lesson-header">
                <h1 id="lesson-title">Vui lòng chọn bài học</h1>
                <div class="audio-controls">
                    <button id="btn-read" class="btn-audio" onclick="toggleReadTheory()">
                        <i class="fa-solid fa-volume-high"></i> Đọc Lý Thuyết
                    </button>
                </div>
            </div>

            <!-- Lý thuyết -->
            <div class="section">
                <h3 class="section-title"><i class="fa-solid fa-book-open"></i> Lý Thuyết</h3>
                <div class="section-body" id="theory-content">
                    Chọn một bài học từ danh sách bên trái để xem nội dung lý thuyết.
                </div>
            </div>

            <!-- Luyện tập / Bài tập -->
            <div class="section">
                <h3 class="section-title"><i class="fa-solid fa-pen-to-square"></i> Luyện Tập (Bài Tập)</h3>
                <div class="section-body" id="practice-content">
                    Chưa có bài tập nào được chọn.
                </div>
            </div>

            <!-- Trò chơi -->
            <div class="section">
                <h3 class="section-title"><i class="fa-solid fa-gamepad"></i> Trò Chơi Học Tập</h3>
                <div class="section-body" id="game-content">
                    Chưa có trò chơi nào được chọn.
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng file JS khớp với tên file trên GitHub -->
    <script src="math2-volume1.js"></script>
</body>
</html>
