<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 ÂM NHẠC 2 - Bé Phan Ngọc Bình An</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    
    <!-- NHẬP KHO DƯ LIỆU 8 CHỦ ĐỀ -->
    <script src="topics-data.js"></script>

    <style>
        .avatar-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #81C784;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        :root {
            --primary-bg: #E8F5E9;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%; max-width: 900px;
            background: #FFFDE7; border: 8px solid #81C784;
            border-radius: 35px; padding: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-home {
            background: #FF7043;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 4px 0 #E64A19;
            display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.1s;
        }

        .btn-home:active { transform: translateY(3px); box-shadow: none; }
        .header-title { text-align: center; font-size: 2rem; color: #2E7D32; margin: 0; }

        .user-dashboard {
            background: #FFFFFF; border-radius: 25px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 6px 0 #A5D6A7; margin-bottom: 20px; border: 3px solid #66BB6A;
        }

        .user-info { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 900; color: #1B5E20; }

        .score-badge {
            background: #FFF3E0; border: 3px solid #FFB74D; padding: 8px 18px;
            border-radius: 20px; font-size: 1.3rem; color: #E65100; font-weight: 900;
        }

        .mode-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }

        .btn-mode {
            padding: 12px 5px; font-size: 1.1rem; font-weight: 900; border: none;
            border-radius: 18px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.15); color: white;
        }

        .mode-play { background: #FF7043; }
        .mode-learn { background: #42A5F5; }
        .mode-show { background: #AB47BC; }
        .mode-challenge { background: #26A69A; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .section-title { text-align: center; font-size: 1.5rem; color: #388E3C; margin-bottom: 15px; font-weight: 900; }

        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .theme-card {
            background: white; border-radius: 25px; padding: 15px; text-align: center;
            border: 4px solid #AED581; box-shadow: 0 8px 0 #C5E1A5; cursor: pointer;
            transition: transform 0.2s;
        }

        .theme-card:hover { transform: scale(1.02); }

        .sub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .btn-subworld {
            background: white; border: 3px solid #81D4FA; border-radius: 20px;
            padding: 15px 10px; font-size: 1.05rem; font-weight: 900; color: #0277BD;
            box-shadow: 0 6px 0 #B3E5FC; cursor: pointer; display: flex; align-items: center; gap: 10px;
            text-align: left;
        }

        .big-btn {
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: 900;
            border-radius: 22px; border: none; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            cursor: pointer; margin-top: 10px; color: white;
        }

        .btn-green { background: #66BB6A; }
        .btn-orange { background: #FFA726; }
        .btn-pink { background: #EC407A; }
        .btn-purple { background: #AB47BC; }

        .game-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }

        .game-overlay.active { display: flex; }

        .game-box {
            background: #FFFDE7; width: 92%; max-width: 650px; max-height: 90vh;
            overflow-y: auto; border-radius: 30px; border: 6px solid #FFB74D;
            padding: 20px; text-align: center; position: relative;
        }

        .close-btn { position: absolute; top: 10px; right: 18px; font-size: 2.2rem; cursor: pointer; color: #E65100; font-weight: 900; z-index: 10; }

        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            border-radius: 20px; border: 4px solid #AB47BC; margin-bottom: 12px; background: #000;
        }

        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .rec-status {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 1.1rem; font-weight: 800; color: #E53935; margin: 8px 0;
        }

        .rec-dot { width: 14px; height: 14px; background: #E53935; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        .btn-back { background: #78909C; color: white; border: none; padding: 8px 18px; border-radius: 15px; font-weight: 900; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- BAR TIÊU ĐỀ KHU VỰC -->
    <div class="top-bar">
        <a href="index.html" class="btn-home" onclick="speak('Trở về Trang chủ')">🏠 Grade-2</a>
        <h1 class="header-title">🎵 ÂM NHẠC 2 🎵</h1>
        <div style="width: 100px;"></div>
    </div>
    
    <!-- DASHBOARD BÉ BÌNH AN -->
    <div class="user-dashboard">
        <div class="user-info">
            <img src="binhan.png" alt="Bé Bình An" class="avatar-img">
            <div>
                <div>Bé Phan Ngọc Bình An</div>
                <div style="font-size: 0.85rem; color: #558B2F; font-weight: 700;">Lớp 2A • SGK Kết nối tri thức</div>
            </div>
        </div>
        <div class="score-badge">⭐ <span id="user-score">150</span> điểm</div>
    </div>

    <!-- CÁC CHẾ ĐỘ -->
    <div class="mode-selector">
        <button class="btn-mode mode-play" onclick="switchView('map-view')">🎮 CHƠI</button>
        <button class="btn-mode mode-learn" onclick="speak('Bé đang ở Chế độ Học SGK Âm Nhạc 2')">📚 HỌC</button>
        <button class="btn-mode mode-show" onclick="openKaraokeShow(currentThemeId)">🎤 BIỂU DIỄN</button>
        <button class="btn-mode mode-challenge" onclick="openChallenge()">🏆 THỬ THÁCH</button>
    </div>

    <!-- VIEW 1: BẢN ĐỒ 8 CHỦ ĐỀ (TỰ ĐỘNG SINH TỪ DATA) -->
    <div id="map-view" class="view-section active">
        <div class="section-title">🌳 VƯỜN ÂM THANH - 8 CHỦ ĐỀ SGK</div>
        <div class="theme-grid" id="theme-grid-container">
            <!-- JavaScript sẽ nạp danh sách 8 chủ đề vào đây -->
        </div>
    </div>

    <!-- VIEW 2: CHI TIẾT CHỦ ĐỀ ĐANG CHỌN (TỰ ĐỘNG ĐỔ DỮ LIỆU) -->
    <div id="theme-detail-view" class="view-section">
        <button class="btn-back" onclick="switchView('map-view')">⬅ Quay lại Vườn</button>
        <div class="section-title" id="theme-detail-title">CHỦ ĐỀ</div>
        <div class="sub-grid" id="theme-detail-buttons">
            <!-- JavaScript sẽ sinh ra 6 nút chức năng tương ứng của chủ đề -->
        </div>
    </div>
</div>

<!-- MODAL GAMIFICATION OVERLAY -->
<div id="game-modal" class="game-overlay">
    <div class="game-box">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    let score = 150;
    let currentThemeId = 1;
    let mediaRecorder;
    let audioChunks = [];
    let audioUrl;
    let audioCtx;
    let destination;
    let bgAudioElement;

    // Giọng đọc AI hướng dẫn
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'vi-VN';
            msg.rate = 0.95;
            window.speechSynthesis.speak(msg);
        }
    }

    function addScore(pts) {
        score += pts;
        document.getElementById('user-score').innerText = score;
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    // KHỞI TẠO NẠP CÁC CHỦ ĐỀ TỪ TOPICS-DATA.JS
    window.onload = function() {
        renderThemeGrid();
    };

    function renderThemeGrid() {
        const container = document.getElementById('theme-grid-container');
        container.innerHTML = '';

        for (let id in MUSIC_DATA) {
            let item = MUSIC_DATA[id];
            let cardHtml = `
                <div class="theme-card" style="background: ${item.bgColor}; border-color: ${item.borderColor};" onclick="selectTheme(${item.id})">
                    <div style="font-size: 2.5rem;">${item.icon}</div>
                    <div style="font-size: 1.2rem; font-weight: 900; color: #2E7D32;">Chủ đề ${item.id}: ${item.title}</div>
                    <div style="font-size: 0.9rem; font-weight: 700; color: #558B2F;">${item.song ? item.song.title : 'Đang cập nhật'}</div>
                </div>
            `;
            container.innerHTML += cardHtml;
        }
    }

    function selectTheme(id) {
        currentThemeId = id;
        let data = MUSIC_DATA[id];
        document.getElementById('theme-detail-title').innerText = `CHỦ ĐỀ ${id}: ${data.title.toUpperCase()}`;
        document.getElementById('theme-detail-title').style.color = data.borderColor;

        let buttonsContainer = document.getElementById('theme-detail-buttons');
        buttonsContainer.innerHTML = `
            <button class="btn-subworld" onclick="playBirdGame(${id})"><span style="font-size: 2rem;">🐦</span>1. Trò chơi âm thanh</button>
            <button class="btn-subworld" onclick="openPracticeSinging(${id})"><span style="font-size: 2rem;">🎵</span>2. Tập hát: ${data.song.title}</button>
            <button class="btn-subworld" onclick="openKaraokeShow(${id})"><span style="font-size: 2rem;">🎤</span>3. Karaoke: ${data.song.title}</button>
            <button class="btn-subworld" onclick="playRhythmGame(${id})"><span style="font-size: 2rem;">👏</span>4. Vỗ tay & Gõ tiết tấu</button>
            <button class="btn-subworld" onclick="openThemeStory(${id})"><span style="font-size: 2rem;">📖</span>5. Thưởng thức & Bài học</button>
            <button class="btn-subworld" onclick="playInstruments(${id})"><span style="font-size: 2rem;">🥁</span>6. Thực hành nhạc cụ</button>
        `;

        switchView('theme-detail-view');
        speak(`Bình An đang ở Chủ đề ${id}: ${data.title}!`);
    }

    function closeModal() {
        document.getElementById('game-modal').classList.remove('active');
        stopMicrophone();
        window.speechSynthesis.cancel();
    }

    /* BÉ TẬP HÁT & KARAOKE (ĐỌC MÃ YOUTUBE TỪ TOPICS-DATA.JS) */
    function openPracticeSinging(id) {
        let data = MUSIC_DATA[id];
        if(!data.song.singYoutubeId) { alert("Chủ đề này đang chuẩn bị video hát mẫu nhé bé!"); return; }
        
        document.getElementById('game-modal').classList.add('active');
        speak(`Bé hãy tập hát bài ${data.song.title} nhé!`);

        document.getElementById('modal-content').innerHTML = `
            <h2 style="margin-top:0;">🎵 TẬP HÁT: ${data.song.title.toUpperCase()}</h2>
            <div class="video-container" style="border-color: #81C784;">
                <iframe src="https://www.youtube.com/embed/${data.song.singYoutubeId}?autoplay=1&rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div id="mic-area">
                <button class="big-btn btn-pink" onclick="startMixedRecording(${id})">🎙️ BẮT ĐẦU HÁT & THU ÂM (CÓ NHẠC NỀN)</button>
            </div>
        `;
    }

    function openKaraokeShow(id) {
        id = id || currentThemeId;
        let data = MUSIC_DATA[id];
        if(!data.song.karaokeYoutubeId) { alert("Chủ đề này đang chuẩn bị bản Karaoke nhé bé!"); return; }

        document.getElementById('game-modal').classList.add('active');
        speak(`Bé hãy xem video Karaoke và bật micro để hát bài ${data.song.title} nhé!`);

        document.getElementById('modal-content').innerHTML = `
            <h2 style="margin-top:0;">🎤 KARAOKE: ${data.song.title.toUpperCase()}</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/${data.song.karaokeYoutubeId}?autoplay=1&rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div id="mic-area">
                <button class="big-btn btn-purple" onclick="startMixedRecording(${id})">🎙️ BẬT MICRO & HÁT THEO BEAT</button>
            </div>
        `;
    }

    /* MIX GIỌNG HÁT VỚI NHẠC NỀN BEAT */
    async function startMixedRecording(id) {
        audioChunks = [];
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            destination = audioCtx.createMediaStreamDestination();

            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const micSource = audioCtx.createMediaStreamSource(micStream);
            micSource.connect(destination);

            mediaRecorder = new MediaRecorder(destination.stream);
            mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
            mediaRecorder.onstop = () => {
                let audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                audioUrl = URL.createObjectURL(audioBlob);
                showRecordingResult();
            };

            mediaRecorder.start();
            speak('Microphone đã bật! Bé cất giọng hát thật hay nhé!');

            document.getElementById('mic-area').innerHTML = `
                <div class="rec-status"><div class="rec-dot"></div><span>ĐANG THU ÂM GIỌNG HÁT BÉ BÌNH AN...</span></div>
                <button class="big-btn btn-green" onclick="finishSinging()">✅ HOÀN THÀNH HÁT</button>
            `;
        } catch (err) {
            alert("Bấm 'Cho phép' (Allow) Microphone để thu âm nhé!");
        }
    }

    function finishSinging() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            if(audioCtx) audioCtx.close();
        }
    }

    function stopMicrophone() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            if(audioCtx) audioCtx.close();
        }
    }

    function showRecordingResult() {
        addScore(25);
        speak('Tuyệt vời! Nghe lại bản thu giọng hát của bé nhé!');

        document.getElementById('modal-content').innerHTML = `
            <h1 style="color: #4CAF50;">🎉 HOÀN THÀNH BẢN THU!</h1>
            <h2>⭐ +25 điểm thưởng</h2>
            <audio controls src="${audioUrl}" style="width: 100%; margin: 15px 0;"></audio>
            <button class="big-btn btn-orange" onclick="closeModal()">🌟 Hoàn thành</button>
        `;
    }

    /* MINI GAME TRÒ CHƠI ÂM THANH */
    function playBirdGame(id) {
        let data = MUSIC_DATA[id];
        document.getElementById('game-modal').classList.add('active');
        speak(data.birdGame ? data.birdGame.question : "Bé hãy lắng nghe âm thanh nhé!");

        let opts = data.birdGame ? data.birdGame.options : ["Chim Sẻ", "Chim Chích Chòe", "Vàng Anh"];
        let correct = data.birdGame ? data.birdGame.correctAnswer : "Chim Chích Chòe";

        document.getElementById('modal-content').innerHTML = `
            <h2>🐦 TRÒ CHƠI ÂM THANH CHỦ ĐỀ ${id}</h2>
            <p style="font-size:1.1rem; font-weight:800;">${data.birdGame ? data.birdGame.question : "Đoán tiếng hót của chú chim?"}</p>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:15px;">
                <button class="big-btn btn-pink" style="font-size:1rem;" onclick="checkAnswer('${opts[0]}', '${correct}')">${opts[0]}</button>
                <button class="big-btn btn-green" style="font-size:1rem;" onclick="checkAnswer('${opts[1]}', '${correct}')">${opts[1]}</button>
                <button class="big-btn btn-purple" style="font-size:1rem;" onclick="checkAnswer('${opts[2]}', '${correct}')">${opts[2]}</button>
            </div>
        `;
    }

    function checkAnswer(chosen, correct) {
        if(chosen === correct) {
            addScore(15);
            speak('Chính xác! Bé Bình An giỏi quá!');
            closeModal();
        } else speak('Chưa đúng rồi, thử lại nhé!');
    }

    function playRhythmGame(id) {
        document.getElementById('game-modal').classList.add('active');
        speak('Vỗ tay theo nhịp phách!');
        document.getElementById('modal-content').innerHTML = `
            <h2>👏 VỖ TAY THEO TIẾT TẤU</h2>
            <p style="font-size:1.1rem; font-weight:800;">[ MẠNH - NHẸ - MẠNH - NHẸ ]</p>
            <button class="big-btn btn-green" onclick="addScore(10); closeModal();">Hoàn thành vỗ tay (+10đ)</button>
        `;
    }

    function openThemeStory(id) {
        let data = MUSIC_DATA[id];
        document.getElementById('game-modal').classList.add('active');
        
        let content = data.story ? data.story.summary : (data.lesson ? data.lesson.content : "Nội dung bài học chuẩn SGK Âm nhạc 2.");
        speak(content);

        document.getElementById('modal-content').innerHTML = `
            <h2>📖 THƯỞNG THỨC & BÀI HỌC</h2>
            <div style="background:#FFF; padding:15px; border-radius:18px; text-align:left; font-weight:800; border:2px solid #81C784;">
                ${content}
            </div>
            <button class="big-btn btn-green" onclick="addScore(10); closeModal();">Đã hiểu bài (+10đ)</button>
        `;
    }

    function playInstruments(id) {
        document.getElementById('game-modal').classList.add('active');
        speak('Thực hành gõ nhạc cụ!');
        document.getElementById('modal-content').innerHTML = `
            <h2>🥁 THỰC HÀNH NHẠC CỤ SGK</h2>
            <button class="big-btn btn-orange" onclick="speak('Cốc cốc! Thanh phách gỗ!'); addScore(5);">🔔 Thanh phách</button>
            <button class="big-btn btn-pink" onclick="speak('Tách tách! Song loan!'); addScore(5);">🪇 Song loan</button>
            <button class="big-btn btn-green" style="margin-top:10px;" onclick="closeModal()">Đóng</button>
        `;
    }

    /* BỘ THỬ THÁCH 3 VÒNG */
    let challengeStep = 1;
    function openChallenge() {
        challengeStep = 1;
        document.getElementById('game-modal').classList.add('active');
        speak('Thử thách Siêu Sao Âm Nhạc! Vượt qua 3 vòng thi nhé!');
        renderChallengeUI();
    }

    function renderChallengeUI() {
        if(challengeStep === 1) {
            speak('Vòng 1: Bài hát Dàn nhạc trong vườn do ai sáng tác?');
            document.getElementById('modal-content').innerHTML = `
                <h2>🏆 THỬ THÁCH SIÊU SAO (VÒNG 1/3)</h2>
                <p style="font-weight:800;">Bài hát "Dàn nhạc trong vườn" do ai sáng tác?</p>
                <button class="big-btn btn-orange" onclick="speak('Chưa đúng rồi!');">Phong Nhã</button>
                <button class="big-btn btn-green" onclick="passChallengeStep();">Tô Đông Hải</button>
            `;
        } else if(challengeStep === 2) {
            speak('Vòng 2: Đi nắng phải nhớ làm gì?');
            document.getElementById('modal-content').innerHTML = `
                <h2>🏆 THỬ THÁCH SIÊU SAO (VÒNG 2/3)</h2>
                <p style="font-weight:800;">Bài hát Con chim chích chòe nhắc bé điều gì khi đi nắng?</p>
                <button class="big-btn btn-green" onclick="passChallengeStep();">Luôn đội mũ/nón</button>
            `;
        } else if(challengeStep === 3) {
            speak('Vòng 3: Nhạc cụ nào dùng để gõ phách?');
            document.getElementById('modal-content').innerHTML = `
                <h2>🏆 THỬ THÁCH SIÊU SAO (VÒNG 3/3)</h2>
                <p style="font-weight:800;">Nhạc cụ gõ phách trong SGK Âm nhạc 2 là gì?</p>
                <button class="big-btn btn-green" onclick="passChallengeStep();">Thanh phách & Song loan</button>
            `;
        }
    }

    function passChallengeStep() {
        addScore(10);
        challengeStep++;
        if(challengeStep > 3) {
            speak('Chúc mừng bé Bình An đạt danh hiệu Siêu Sao Âm Nhạc!');
            document.getElementById('modal-content').innerHTML = `
                <h1 style="color:#E91E63;">👑 CHIẾN THẮNG!</h1>
                <div style="font-size:4rem;">🏆 ⭐ 👑</div>
                <button class="big-btn btn-pink" onclick="addScore(30); closeModal();">🏅 NHẬN HUY HIỆU VÀO BẢNG VÀNG</button>
            `;
        } else renderChallengeUI();
    }
</script>

</body>
</html>
